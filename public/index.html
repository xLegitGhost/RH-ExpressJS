<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RRHH Taller Node.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] flex items-center justify-center min-h-screen">

    <div class="bg-black border border-zinc-800 p-10 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="mb-10 text-center">
            <h2 class="text-3xl font-extrabold text-white tracking-tighter">Taller Node.js S.A. de C.V.</h2>
            <div class="h-1 w-12 bg-white mx-auto mt-3"></div>
            <p class="text-zinc-500 mt-4 text-sm font-medium uppercase tracking-widest">Acceso al Sistema de RRHH</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2 ml-1">Usuario / Correo</label>
                <input type="text" id="username" name="username" required 
                    class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white focus:border-white transition-all duration-200">
            </div>
            
            <div>
                <label for="password" class="block text-xs font-bold text-zinc-400 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                <input type="password" id="password" name="password" required 
                    class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white focus:border-white transition-all duration-200">
            </div>
            
            <div id="errorMessage" class="text-red-400 text-xs font-medium hidden text-center bg-red-900/20 py-2 rounded-lg border border-red-900/30"></div>

            <button type="submit" id="submitBtn"
                class="w-full flex justify-center py-4 px-4 rounded-xl text-sm font-bold text-black bg-white hover:bg-zinc-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-white transition-all duration-300 transform active:scale-[0.98]">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-zinc-900 text-center">
            <p class="text-zinc-600 text-[10px] uppercase tracking-widest">Panel solo para Administradores</p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
